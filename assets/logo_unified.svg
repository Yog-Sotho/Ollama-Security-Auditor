<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <!-- Hex glow gradient -->
    <radialGradient id="hexGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
    </radialGradient>
    <!-- Sweep gradient (radar) -->
    <radialGradient id="sweepGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.7" />
      <stop offset="80%" style="stop-color:#00ff88;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
    </radialGradient>
    <!-- Clip path for hex -->
    <clipPath id="hexClip">
      <polygon points="200,80 258,112 258,176 200,208 142,176 142,112" />
    </clipPath>
    <!-- Inner glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-5%" y="-20%" width="110%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid lines -->
  <g stroke="#1a2a1a" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Hex glow halo -->
  <circle cx="200" cy="144" r="85" fill="url(#hexGlow)"/>

  <!-- Outer hexagon ring (faint) -->
  <polygon
    points="200,56 269,96 269,176 200,216 131,176 131,96"
    fill="none"
    stroke="#00ff88"
    stroke-width="1"
    stroke-dasharray="8,4"
    opacity="0.3"
  />

  <!-- Main hexagon -->
  <polygon
    points="200,76 258,110 258,178 200,212 142,178 142,110"
    fill="#0d1f0d"
    stroke="#00ff88"
    stroke-width="2"
    filter="url(#glow)"
  />

  <!-- Radar circles inside hex -->
  <circle cx="200" cy="144" r="42" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.25" clip-path="url(#hexClip)"/>
  <circle cx="200" cy="144" r="28" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.35" clip-path="url(#hexClip)"/>
  <circle cx="200" cy="144" r="14" fill="none" stroke="#00ff88" stroke-width="0.8" opacity="0.5" clip-path="url(#hexClip)"/>

  <!-- Radar crosshairs -->
  <line x1="158" y1="144" x2="242" y2="144" stroke="#00ff88" stroke-width="0.7" opacity="0.3" clip-path="url(#hexClip)"/>
  <line x1="200" y1="102" x2="200" y2="186" stroke="#00ff88" stroke-width="0.7" opacity="0.3" clip-path="url(#hexClip)"/>

  <!-- Radar sweep (wedge — simulated with path) -->
  <path
    d="M200,144 L242,109 A42,42 0 0,1 242,144 Z"
    fill="url(#sweepGrad)"
    opacity="0.55"
    clip-path="url(#hexClip)"
  />

  <!-- Center dot -->
  <circle cx="200" cy="144" r="4" fill="#00ff88" filter="url(#glow)"/>

  <!-- Scan target blip -->
  <circle cx="230" cy="122" r="3" fill="#ff4444" filter="url(#glow)" opacity="0.9"/>
  <circle cx="230" cy="122" r="7" fill="none" stroke="#ff4444" stroke-width="1" opacity="0.4"/>

  <!-- Shield outline overlay on hex -->
  <polygon
    points="200,76 258,110 258,178 200,212 142,178 142,110"
    fill="none"
    stroke="#00ff88"
    stroke-width="1.5"
    opacity="0.9"
  />

  <!-- Lock icon (top right of hex) -->
  <rect x="216" y="96" width="12" height="10" rx="1" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.7"/>
  <path d="M218,96 Q218,91 222,91 Q226,91 226,96" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.7"/>

  <!-- Right side: Title text -->
  <text
    x="310"
    y="130"
    font-family="'Courier New', Courier, monospace"
    font-weight="700"
    font-size="52"
    fill="#00ff88"
    filter="url(#textGlow)"
    letter-spacing="4"
  >OLLAMA</text>

  <!-- Underline accent -->
  <line x1="310" y1="142" x2="720" y2="142" stroke="#00ff88" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtitle line 1 -->
  <text
    x="312"
    y="172"
    font-family="'Courier New', Courier, monospace"
    font-weight="400"
    font-size="18"
    fill="#aaffcc"
    letter-spacing="6"
  >UNIFIED SECURITY SCANNER</text>

  <!-- Subtitle line 2 -->
  <text
    x="314"
    y="202"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    fill="#447744"
    letter-spacing="2"
  >Discover  ·  Audit  ·  Report</text>

  <!-- Tag row -->
  <!-- Ollama tag -->
  <rect x="312" y="230" width="90" height="22" rx="4" fill="#0d2a0d" stroke="#00ff88" stroke-width="1" opacity="0.8"/>
  <text x="357" y="245" font-family="'Courier New', Courier, monospace" font-size="11" fill="#00ff88" text-anchor="middle" letter-spacing="1">Ollama</text>

  <!-- LM Studio tag -->
  <rect x="412" y="230" width="102" height="22" rx="4" fill="#0d2a0d" stroke="#00aa66" stroke-width="1" opacity="0.8"/>
  <text x="463" y="245" font-family="'Courier New', Courier, monospace" font-size="11" fill="#00aa66" text-anchor="middle" letter-spacing="1">LM Studio</text>

  <!-- TextGen tag -->
  <rect x="524" y="230" width="118" height="22" rx="4" fill="#0d2a0d" stroke="#007744" stroke-width="1" opacity="0.8"/>
  <text x="583" y="245" font-family="'Courier New', Courier, monospace" font-size="11" fill="#007744" text-anchor="middle" letter-spacing="1">TextGen WebUI</text>

  <!-- IPv4+IPv6 tag -->
  <rect x="652" y="230" width="98" height="22" rx="4" fill="#0d2a0d" stroke="#336633" stroke-width="1" opacity="0.8"/>
  <text x="701" y="245" font-family="'Courier New', Courier, monospace" font-size="11" fill="#336633" text-anchor="middle" letter-spacing="1">IPv4 + IPv6</text>

  <!-- Bottom bar -->
  <line x1="30" y1="295" x2="770" y2="295" stroke="#1a3a1a" stroke-width="1"/>

  <!-- Bottom left: version -->
  <text
    x="40"
    y="318"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#336633"
    letter-spacing="1"
  >v2.0.0</text>

  <!-- Bottom center: scan label -->
  <text
    x="400"
    y="318"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#336633"
    text-anchor="middle"
    letter-spacing="2"
  >github.com/Yog-Sotho/Ollama-Security-Auditor</text>

  <!-- Bottom right: 20 CVE probes label -->
  <text
    x="760"
    y="318"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#336633"
    text-anchor="end"
    letter-spacing="1"
  >20+ probes</text>

  <!-- Corner brackets -->
  <path d="M18,18 L18,42 M18,18 L42,18" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M782,18 L758,18 M782,18 L782,42" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M18,382 L18,358 M18,382 L42,382" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M782,382 L758,382 M782,382 L782,358" stroke="#00ff88" stroke-width="1.5" fill="none" opacity="0.4"/>
</svg>
